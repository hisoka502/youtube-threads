<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube 片段討論串</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
    input { font: inherit; padding: 4px 6px; }
    input.url { width: 100%; box-sizing: border-box; }
    input.time { width: 6em; }
    textarea { font: inherit; width: 100%; box-sizing: border-box; }
    #player-box { aspect-ratio: 16 / 9; background: #000; }
    #player-box iframe, #player-box > div { width: 100%; height: 100%; }
    #auth form { margin: 4px 0; }
    #auth input { width: 12em; }
    #error { min-height: 1.6em; font-weight: bold; color: #b00020; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    ul { padding-left: 0; list-style: none; }
    li { padding: 6px 8px; border-bottom: 1px solid #ddd; }
    li.selected { background: #fff6d6; }
    li button { margin-left: 4px; }
    .comment-body { white-space: pre-wrap; }
    .meta { color: #666; font-size: 0.875em; margin-left: 6px; }
    .hint { color: #666; }
    body.busy { cursor: progress; }
    code { background: #f2f2f2; padding: 0 4px; }
  </style>
</head>
<body>
  <h1>YouTube 片段討論串</h1>
  <p class="hint">開發用頁面。<span id="storage"></span></p>

  <section id="auth">
    <div id="signed-in" hidden>
      已登入：<strong id="user-display-name"></strong>
      <button id="sign-out" type="button">登出</button>
    </div>
    <div id="signed-out">
      <form id="sign-in-form">
        <strong>登入</strong>
        <input id="sign-in-email" type="email" placeholder="Email" autocomplete="email">
        <input id="sign-in-password" type="password" placeholder="密碼" autocomplete="current-password">
        <button>登入</button>
      </form>
      <form id="sign-up-form">
        <strong>註冊</strong>
        <input id="sign-up-email" type="email" placeholder="Email" autocomplete="email">
        <input id="sign-up-password" type="password" placeholder="密碼（至少 6 個字元）" autocomplete="new-password">
        <input id="sign-up-name" placeholder="顯示名稱（留言時顯示）">
        <button>註冊</button>
      </form>
      <p class="hint">未登入只能瀏覽；登入後才能建立片段與留言。</p>
    </div>
  </section>

  <form id="load-form">
    <input id="url" class="url" placeholder="貼上 YouTube 網址，例如 https://youtu.be/…">
    <button>載入</button>
  </form>

  <div id="player-box"><div id="player"></div></div>
  <p>目前時間：<span id="current">-</span></p>
  <p id="error" role="alert"></p>

  <div class="columns">
    <section>
      <h2>片段</h2>
      <form id="clip-form">
        開始 <input id="start" class="time" placeholder="2:15">
        結束 <input id="end" class="time" placeholder="留空＝開始＋5 秒">
        標題 <input id="title" placeholder="選填">
        <button>建立片段</button>
      </form>
      <ul id="clips"></ul>
      <p id="no-clips" class="hint">這部影片還沒有片段。</p>
    </section>

    <section>
      <h2>討論串</h2>
      <p id="no-thread" class="hint">點片段的「討論串」開啟。</p>
      <div id="thread" hidden>
        <p id="thread-title"></p>
        <ul id="comments"></ul>
        <form id="comment-form">
          <textarea id="body" rows="3" placeholder="留言"></textarea>
          <button>送出留言</button>
        </form>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
